# ==========================================
# JPA / HIBERNATE SETTINGS
# ==========================================
# create-drop = creates tables fresh every run (use during development)
# update      = keeps existing data, only adds new columns
# validate    = just validates, doesn't change anything (use in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# THYMELEAF SETTINGS
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# FILE UPLOAD SETTINGS (for future use)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# LOGGING
# ==========================================
logging.level.com.grocery=DEBUG
logging.level.org.hibernate.SQL=DEBUG
