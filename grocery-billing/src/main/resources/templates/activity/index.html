<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- sidebar same as other pages -->

<div class="main-content" id="mainContent">
    <nav class="top-navbar">
        <h5 class="mb-0 ms-3">
            <i class="bi bi-clock-history me-2"></i>Activity Log
        </h5>
    </nav>

    <div class="page-content">

        <!-- ── TODAY'S PERFORMANCE ── -->
        <div class="table-card mb-4">
            <h6 class="fw-bold mb-3">
                <i class="bi bi-bar-chart me-2 text-primary"></i>
                Today's Performance
            </h6>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th class="text-center">Total Actions</th>
                            <th class="text-center">Created</th>
                            <th class="text-center">Deleted</th>
                            <th>Filter</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${performance}">
                            <td>
                                <i class="bi bi-person-circle me-2 text-primary"></i>
                                <strong th:text="${p.username}">user</strong>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-primary"
                                      th:text="${p.totalActions}">0</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-success"
                                      th:text="${p.creates}">0</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-danger"
                                      th:text="${p.deletes}">0</span>
                            </td>
                            <td>
                                <a th:each="u : ${users}"
                                   th:if="${u.username == p.username}"
                                   th:href="@{/activity(userId=${u.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    View Logs
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${performance.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-3">
                                No activity today yet
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row g-4">

            <!-- ── ACTIVITY LOG ── -->
            <div class="col-lg-8">
                <div class="table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0">
                            <i class="bi bi-list-ul me-2 text-success"></i>
                            Activity Log
                        </h6>
                        <a th:href="@{/activity}"
                           class="btn btn-sm btn-outline-secondary">
                            Show All
                        </a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 small">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td class="text-muted"
                                        th:text="${#temporals.format(
                                            log.createdAt,
                                            'dd MMM HH:mm')}">
                                    </td>
                                    <td>
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="${log.username}"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="
                                                ${log.action == 'CREATE'} ? 'bg-success' :
                                                (${log.action == 'DELETE'} ? 'bg-danger' :
                                                (${log.action == 'LOGIN'}  ? 'bg-primary' :
                                                (${log.action == 'LOGOUT'} ? 'bg-secondary' :
                                                 'bg-warning text-dark')))"
                                              th:text="${log.action}">
                                        </span>
                                    </td>
                                    <td th:text="${log.description}"></td>
                                </tr>
                                <tr th:if="${logs.isEmpty()}">
                                    <td colspan="4" class="text-center text-muted py-3">
                                        No activity logs found
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ── LOGIN HISTORY ── -->
            <div class="col-lg-4">
                <div class="table-card">
                    <h6 class="fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-2 text-info"></i>
                        Login History
                    </h6>
                    <div th:each="h : ${loginHistory}"
                         class="d-flex justify-content-between
                                align-items-center py-2 border-bottom">
                        <div>
                            <div class="fw-semibold small"
                                 th:text="${h.username}"></div>
                            <div class="text-muted"
                                 style="font-size:11px"
                                 th:text="${#temporals.format(
                                     h.loginTime,
                                     'dd MMM yyyy HH:mm')}">
                            </div>
                        </div>
                        <span class="badge"
                              th:classappend="${h.status.name() == 'SUCCESS'}
                                             ? 'bg-success' : 'bg-danger'"
                              th:text="${h.status.name()}">
                        </span>
                    </div>
                    <div th:if="${loginHistory.isEmpty()}"
                         class="text-center text-muted py-3 small">
                        No login history yet
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
