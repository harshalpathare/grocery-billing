<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Settings | Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/super-admin.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <div class="brand"><i class="bi bi-lightning-fill me-2 text-warning"></i>Super Admin</div>
    <span style="opacity:0.5">|</span>
    <span style="opacity:0.7;font-size:14px;">Platform Management</span>
    <div style="margin-left:auto;display:flex;gap:10px;">
        <a th:href="@{/super/shops}" class="btn btn-sm btn-outline-light">
            <i class="bi bi-shop me-1"></i>All Shops
        </a>
        <a th:href="@{/super/settings}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-gear-fill me-1"></i>Settings
        </a>
        <a th:href="@{/}" class="btn btn-sm btn-outline-light">
            <i class="bi bi-house me-1"></i>Dashboard
        </a>
        <form th:action="@{/logout}" method="post" class="mb-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </form>
    </div>
</div>

<div class="page-wrap">

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-gear-fill me-2 text-primary"></i>Global Settings</h4>
            <p class="text-muted mb-0 small">Manage platform branding and appearance</p>
        </div>
    </div>

    <div class="card-box" style="max-width: 600px;">
        <form th:action="@{/super/settings}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <div class="mb-3">
                <label class="form-label fw-semibold">App Name</label>
                <input type="text" name="appName" class="form-control" th:value="${appName}" required>
                <div class="form-text">Displayed in the main sidebar.</div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">App Name Color</label>
                <input type="color" name="appNameColor" class="form-control form-control-color" th:value="${appNameColor}">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">App Icon (Bootstrap Icon Class)</label>
                <input type="text" name="appIcon" class="form-control" th:value="${appIcon}" placeholder="e.g. bi-shop">
                <div class="form-text">Used if no logo is provided.</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Logo URL (Optional)</label>
                <input type="text" name="logoUrl" class="form-control" th:value="${logoUrl}" placeholder="https://example.com/logo.png">
                <div class="form-text">Provide an external URL, or upload a file below.</div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Upload Logo File</label>
                <input type="file" name="logoFile" class="form-control" accept="image/*">
                <div class="form-text">Max 2MB. If uploaded, overrides the Logo URL.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-save me-1"></i> Save Settings
            </button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
