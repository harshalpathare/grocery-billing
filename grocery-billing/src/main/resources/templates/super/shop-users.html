<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Super Admin'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#f0f2f5; font-family:'Segoe UI',sans-serif; }
        .topbar { background:#1a1f2e; color:white; padding:14px 24px;
                  display:flex; align-items:center; gap:16px; }
        .topbar .brand { font-weight:700; font-size:18px; color:white; text-decoration:none; }
        .page-wrap { max-width:900px; margin:30px auto; padding:0 20px; }
        .card-box { background:white; border-radius:12px; padding:20px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .badge-owner { background:#cff4fc; color:#055160; }
        .badge-cashier { background:#e2e3e5; color:#41464b; }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <a th:href="@{/super/shops}" class="brand"><i class="bi bi-lightning-fill me-2 text-warning"></i>Super Admin</a>
    <span style="opacity:0.5">|</span>
    <span style="opacity:0.7;font-size:14px;" th:text="${pageTitle}">Shop Users</span>
</div>

<div class="page-wrap">

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <a th:href="@{/super/shops}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <div>
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-people-fill me-2 text-primary"></i>Users: <span th:text="${shop.shopName}"></span>
                </h4>
            </div>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
            <i class="bi bi-person-plus me-1"></i> Add User
        </button>
    </div>

    <!-- Users Table -->
    <div class="card-box">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Last Login</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u, stat : ${users}">
                        <td class="text-muted small" th:text="${stat.index + 1}">1</td>
                        <td class="fw-semibold" th:text="${u.fullName}">Name</td>
                        <td th:text="${u.username}">username</td>
                        <td>
                            <span th:if="${u.role == 'ROLE_OWNER'}" class="badge badge-owner">Owner</span>
                            <span th:if="${u.role == 'ROLE_CASHIER'}" class="badge badge-cashier">Cashier</span>
                        </td>
                        <td>
                            <span th:if="${u.enabled}" class="badge bg-success bg-opacity-10 text-success">Active</span>
                            <span th:unless="${u.enabled}" class="badge bg-danger bg-opacity-10 text-danger">Disabled</span>
                        </td>
                        <td class="small text-muted" th:text="${u.lastLogin != null ? #temporals.format(u.lastLogin, 'dd MMM yyyy, HH:mm') : 'Never'}">Never</td>
                    </tr>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="6" class="text-center py-4 text-muted">No users found for this shop.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold"><i class="bi bi-person-plus me-2 text-primary"></i>Add New User</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/super/shops/{id}/users/new(id=${shop.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" name="fullName" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Username</label>
                        <input type="text" name="username" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password</label>
                        <input type="password" name="password" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold small">Role</label>
                        <select name="role" class="form-select form-select-sm">
                            <option value="ROLE_CASHIER">Cashier (Billing Only)</option>
                            <option value="ROLE_OWNER">Owner (Full Access)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js?v=25}"></script>
</body>
</html>
