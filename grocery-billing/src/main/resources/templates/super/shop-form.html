<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Super Admin'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#f0f2f5; font-family:'Segoe UI',sans-serif; }
        .topbar { background:#1a1f2e; color:white; padding:14px 24px;
                  display:flex; align-items:center; gap:16px; }
        .topbar .brand { font-weight:700; font-size:18px; color:white; text-decoration:none; }
        .page-wrap { max-width:800px; margin:30px auto; padding:0 20px; }
        .card-box { background:white; border-radius:12px; padding:30px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <a th:href="@{/super/shops}" class="brand"><i class="bi bi-lightning-fill me-2 text-warning"></i>Super Admin</a>
    <span style="opacity:0.5">|</span>
    <span style="opacity:0.7;font-size:14px;" th:text="${pageTitle}">Shop Form</span>
    <div style="margin-left:auto;display:flex;gap:10px;">
        <a th:href="@{/super/settings}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-gear-fill me-1"></i>Settings
        </a>
        <a th:href="@{/super/shops}" class="btn btn-sm btn-outline-light">
            <i class="bi bi-shop me-1"></i>All Shops
        </a>
        <a th:href="@{/}" class="btn btn-sm btn-outline-light">
            <i class="bi bi-house me-1"></i>Dashboard
        </a>
    </div>
</div>

<div class="page-wrap">
    
    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/super/shops}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h4 class="fw-bold mb-0" th:text="${pageTitle}">Shop Form</h4>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-box">
        <form th:action="${isEdit} ? @{/super/shops/{id}/edit(id=${shop.id})} : @{/super/shops/new}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <h5 class="fw-bold mb-3"><i class="bi bi-building me-2 text-primary"></i>Shop Details</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Shop Name *</label>
                    <input type="text" name="shopName" class="form-control" th:value="${shop.shopName}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Business Type</label>
                    <select name="businessType" class="form-select">
                        <option value="GROCERY" th:selected="${shop.businessType == 'GROCERY'}">Grocery & Supermarket</option>
                        <option value="PHARMACY" th:selected="${shop.businessType == 'PHARMACY'}">Pharmacy</option>
                        <option value="RETAIL" th:selected="${shop.businessType == 'RETAIL'}">General Retail</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Owner Name *</label>
                    <input type="text" name="ownerName" class="form-control" th:value="${shop.ownerName}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" th:value="${shop.phone}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" th:value="${shop.email}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">GSTIN</label>
                    <input type="text" name="gstin" class="form-control" th:value="${shop.gstin}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Address</label>
                    <textarea name="address" class="form-control" rows="2" th:text="${shop.address}"></textarea>
                </div>
            </div>

            <!-- New Shop Only Fields -->
            <th:block th:unless="${isEdit}">
                <hr class="my-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-person-badge me-2 text-primary"></i>Initial Owner Account</h5>
                <div class="alert alert-info py-2 small mb-3">
                    <i class="bi bi-info-circle me-1"></i> This creates the first user who can log into the shop.
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Full Name *</label>
                        <input type="text" name="ownerFullName" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Username *</label>
                        <input type="text" name="ownerUsername" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Password *</label>
                        <input type="password" name="ownerPassword" class="form-control" required>
                    </div>
                </div>

                <hr class="my-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-credit-card-fill me-2 text-primary"></i>Subscription</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Initial Duration (Months)</label>
                        <input type="number" name="subscriptionMonths" class="form-control" value="12" min="1">
                    </div>
                </div>
            </th:block>

            <div class="mt-4 text-end">
                <a th:href="@{/super/shops}" class="btn btn-outline-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary px-4">Save Shop</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script defer th:src="@{/js/app.js?v=32}"></script>
</body>
</html>
