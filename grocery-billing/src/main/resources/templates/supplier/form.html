<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supplier Form | Grocery Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span>Grocery Bill</span></div>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a th:href="@{/suppliers}" class="nav-link active"><i class="bi bi-truck"></i><span>Suppliers</span></a>
        <a th:href="@{/purchases}" class="nav-link"><i class="bi bi-cart-check"></i><span>Purchases</span></a>
        <a th:href="@{/products}" class="nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
        <a th:href="@{/customers}" class="nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
        <a th:href="@{/bills/new}" class="nav-link"><i class="bi bi-receipt"></i><span>New Bill</span></a>
        <a th:href="@{/bills}" class="nav-link"><i class="bi bi-journal-text"></i><span>All Bills</span></a>
        <a th:href="@{/credit}" class="nav-link"><i class="bi bi-credit-card"></i><span>Credit / Udhari</span></a>
        <a th:href="@{/reports}" class="nav-link"><i class="bi bi-bar-chart"></i><span>Reports</span></a>        <a th:href="@{/activity}" class="nav-link"           th:classappend="${activePage == 'activity'} ? 'active' : ''">            <i class="bi bi-clock-history"></i>            <span>Activity Log</span>        </a>
        <a th:href="@{/insights}" class="nav-link"
           th:classappend="${activePage == 'insights'} ? 'active' : ''">
            <i class="bi bi-graph-up-arrow"></i>
            <span>AI Insights</span>
        </a>


    </nav>
    <div class="sidebar-bottom">
        <a th:href="@{/settings}" class="nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>
    </div>
</div>

<div class="main-content" id="mainContent">
    <nav class="top-navbar">
        <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <h5 class="mb-0 ms-3" th:text="${pageTitle}">Supplier</h5>
        <div class="ms-auto">
            <a th:href="@{/suppliers}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
    </nav>

    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="table-card">
                    <form th:action="${isEdit}
                              ? @{/suppliers/{id}/edit(id=${supplier.id})}
                              : @{/suppliers/new}"
                          th:object="${supplier}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Supplier Name *</label>
                                <input type="text" th:field="*{name}"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Contact Person</label>
                                <input type="text" th:field="*{contactPerson}"
                                       class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone</label>
                                <input type="text" th:field="*{phone}"
                                       class="form-control" placeholder="9999999999">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" th:field="*{email}"
                                       class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">GSTIN</label>
                                <input type="text" th:field="*{gstin}"
                                       class="form-control" placeholder="27AABCU9603R1ZX"
                                       maxlength="15">
                                <div class="form-text">Supplier's GST number for ITC</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Address</label>
                                <input type="text" th:field="*{address}"
                                       class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Notes</label>
                                <textarea th:field="*{notes}" class="form-control"
                                          rows="2"></textarea>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${isEdit} ? 'Update Supplier' : 'Add Supplier'"></span>
                            </button>
                            <a th:href="@{/suppliers}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });
</script>
</body>
</html>
