<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 — Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#f0f2f5; display:flex; align-items:center;
               justify-content:center; min-height:100vh; }
        .error-card { background:white; border-radius:20px; padding:48px;
                      text-align:center; max-width:480px;
                      box-shadow:0 4px 24px rgba(0,0,0,0.08); }
        .error-code { font-size:96px; font-weight:900;
                      color:#dc3545; line-height:1; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code">500</div>
    <h4 class="fw-bold mt-2 mb-2">Something Went Wrong</h4>
    <p class="text-muted mb-4">
        An unexpected error occurred. Please try again or contact support.
    </p>
    <a href="/" class="btn btn-primary me-2">
        <i class="bi bi-house me-1"></i>Go to Dashboard
    </a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Go Back
    </a>
</div>
</body>
</html>
