<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .error-card {
            background: white;
            border-radius: 10px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        .error-icon {
            font-size: 4rem;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .error-message {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 1rem;
        }
        .error-description {
            color: #888;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-back {
            display: inline-block;
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-shield-exclamation"></i>
        </div>
        <div class="error-code" th:text="${errorCode}">403</div>
        <div class="error-message" th:text="${errorMessage}">Access Denied</div>
        <div class="error-description" th:text="${errorDescription}">
            You do not have permission to access this page.
        </div>
        <div>
            <a th:href="@{/}" class="btn btn-primary btn-back">
                <i class="bi bi-house-fill me-2"></i>Go to Dashboard
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary btn-back">
                <i class="bi bi-box-arrow-in-right me-2"></i>Re-login
            </a>
        </div>
    </div>
</div>
</body>
</html>
