<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receive Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span>Grocery Bill</span></div>

    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a th:href="@{/products}" class="nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
        <a th:href="@{/customers}" class="nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
        <a th:href="@{/bills/new}" class="nav-link"><i class="bi bi-receipt"></i><span>New Bill</span></a>
        <a th:href="@{/bills}" class="nav-link"><i class="bi bi-journal-text"></i><span>All Bills</span></a>
        <a th:href="@{/credit}" class="nav-link active"><i class="bi bi-credit-card"></i><span>Credit / Udhari</span></a>
        <a th:href="@{/reports}" class="nav-link"><i class="bi bi-bar-chart"></i><span>Reports</span></a>
    </nav>

    <div class="sidebar-bottom">
        <a th:href="@{/settings}" class="nav-link">
            <i class="bi bi-gear"></i><span>Settings</span>
        </a>
    </div>
</div>

<div class="main-content" id="mainContent">

    <!-- Top Navbar -->
    <nav class="top-navbar">
        <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>

        <h5 class="mb-0 ms-3">Receive Payment</h5>

        <div class="ms-auto">
            <a th:href="@{/credit}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" class="mb-0 d-inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-lg-5">

                <!-- Error -->
                <div th:if="${errorMessage}" class="alert alert-danger">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <div class="table-card">

                    <!-- Customer Summary -->
                    <div class="text-center mb-4 p-3 bg-light rounded">
                        <div class="fw-bold fs-5" th:text="${customer.name}">Name</div>
                        <div class="text-muted small" th:text="${customer.phone}">Phone</div>

                        <div class="mt-2">
                            <span class="text-muted small">Pending Balance:</span>
                            <span class="fs-4 fw-bold text-danger ms-2">
                                ₹<span th:text="${#numbers.formatDecimal(customer.balance,1,2)}">0.00</span>
                            </span>
                        </div>
                    </div>

                    <!-- Payment Form -->
                    <form th:action="@{/credit/pay/{id}(id=${customer.id})}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Amount -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Payment Amount (₹) <span class="text-danger">*</span>
                            </label>

                            <div class="input-group input-group-lg">
                                <span class="input-group-text">₹</span>
                                <input type="number" name="amount"
                                       class="form-control"
                                       step="0.01"
                                       min="1"
                                       th:max="${customer.balance}"
                                       placeholder="0.00"
                                       required>
                            </div>

                            <div class="form-text">
                                Maximum payable:
                                ₹<span th:text="${#numbers.formatDecimal(customer.balance,1,2)}"></span>
                            </div>
                        </div>

                        <!-- Payment Mode -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Payment Mode</label>
                            <select name="description" class="form-select">
                                <option value="Cash payment received">Cash</option>
                                <option value="UPI payment received">UPI</option>
                                <option value="Bank transfer received">Bank Transfer</option>
                                <option value="Cheque payment received">Cheque</option>
                            </select>
                        </div>

                        <!-- Quick Amount -->
                        <div class="mb-4">
                            <label class="form-label small text-muted">Quick Amount</label>

                            <div class="d-flex gap-2 flex-wrap">
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setAmount(100)">₹100</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setAmount(200)">₹200</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setAmount(500)">₹500</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setAmount(1000)">₹1000</button>

                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:onclick="'setAmount(' + ${customer.balance} + ')'">
                                    Full Amount
                                </button>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4 flex-grow-1">
                                <i class="bi bi-check-circle me-2"></i>Confirm Payment
                            </button>
                            <a th:href="@{/credit}" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                    <!-- ✅ Clear Full Udhari -->
                    <hr class="my-3">

                    <div class="p-3 bg-light rounded border">
                        <p class="small fw-semibold mb-2">
                            <i class="bi bi-check2-all me-1 text-success"></i>
                            Clear Full Udhari
                        </p>

                        <p class="small text-muted mb-3">
                            This will mark ALL pending dues as cleared.
                        </p>

                        <form th:action="@{/credit/clear/{id}(id=${customer.id})}" method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="btn btn-success w-100"
                                    onclick="return confirm('Clear full dues?')">
                                <i class="bi bi-check2-all me-2"></i>
                                Clear All Dues
                                (₹<span th:text="${#numbers.formatDecimal(customer.balance,1,2)}">0</span>)
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });

    function setAmount(val) {
        document.querySelector('input[name="amount"]').value = val.toFixed(2);
    }
</script>

</body>
</html>
