<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Debug - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="alert alert-warning" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <strong>Admin Debug Page</strong> - Promote a user to ROLE_ADMIN
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Users in Database</h5>
        </div>
        <div class="card-body">
            <div th:if="${users.isEmpty()}" class="alert alert-info">
                No users found in database.
            </div>
            <table th:if="${!users.isEmpty()}" class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Enabled</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td>
                        <span th:if="${u.role == 'ROLE_ADMIN'}" class="badge bg-danger" th:text="${u.role}"></span>
                        <span th:if="${u.role != 'ROLE_ADMIN'}" class="badge bg-secondary" th:text="${u.role}"></span>
                    </td>
                    <td th:text="${u.enabled} ? 'Yes' : 'No'"></td>
                    <td>
                        <a th:if="${u.role != 'ROLE_ADMIN'}" th:href="@{/admin/promote/{id}(id=${u.id})}" class="btn btn-sm btn-warning">
                            Promote to Admin
                        </a>
                        <span th:if="${u.role == 'ROLE_ADMIN'}" class="text-muted">Already Admin</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{layout/rag :: ragWidget}"></div>
</body>
</html>
