<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grocery Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3561 50%, #1a1f2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .shop-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4f97ff, #7bb8ff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            margin: 0 auto 16px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1f2e;
            text-align: center;
            margin-bottom: 4px;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #495057;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e8ecf0;
            padding: 10px 14px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #4f97ff;
            box-shadow: 0 0 0 3px rgba(79, 151, 255, 0.15);
        }

        .input-group-text {
            background: #f8f9fa;
            border: 1.5px solid #e8ecf0;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #6c757d;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, #1a1f2e, #2d3561);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            padding: 12px;
            font-size: 15px;
            width: 100%;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 31, 46, 0.3);
            color: white;
        }

        .alert {
            border-radius: 10px;
            font-size: 13px;
            border: none;
            margin-bottom: 20px;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .form-check-label {
            font-size: 13px;
            color: #6c757d;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #adb5bd;
            font-size: 12px;
        }

        .default-creds {
            background: #f0f6ff;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px dashed #4f97ff55;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo + Title -->
            <div class="shop-logo">
                <i class="bi bi-shop"></i>
            </div>
            <div class="login-title" th:text="${shopName}">Grocery Store</div>
            <div class="login-subtitle">Billing Management System — Sign in to continue</div>

            <!-- Success message (after logout) -->
            <div th:if="${logoutMessage}" class="alert alert-success py-2">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${logoutMessage}"></span>
            </div>

            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Default credentials hint (shown only when no error/logout) -->
            <!-- ✅ Null-safe check using != null -->
            <div th:unless="${errorMessage != null or logoutMessage != null}" class="default-creds">
                <div class="small text-primary fw-semibold mb-1">
                    <i class="bi bi-info-circle me-1"></i>Default Login
                </div>
                <div class="small text-muted">
                    Username: <strong>admin</strong> &nbsp;|&nbsp;
                    Password: <strong>admin123</strong>
                </div>
            </div>

            <!-- LOGIN FORM -->
            <!--
            action="/login" → Spring Security intercepts this POST
            Spring Security checks username/password automatically.
            We don't write any login logic in Java.
        -->
            <form th:action="@{/login}" method="post">

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username"
                            autofocus required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="passwordInput" class="form-control"
                            placeholder="Enter your password" required>
                        <button type="button" class="btn btn-outline-secondary"
                            style="border-radius:0 10px 10px 0;border-color:#e8ecf0" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="remember-row">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me for 7 days
                        </label>
                    </div>
                </div>

                <!-- CSRF Token (Spring Security requires this) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Submit -->
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>

            </form>

            <div class="login-footer">
                <i class="bi bi-shield-lock me-1"></i>
                Secured by Spring Security · Grocery Billing System
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>


</body>

</html>
