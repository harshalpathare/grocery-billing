<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Customer' : 'Add Customer'">Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span>Grocery Bill</span></div>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a th:href="@{/products}" class="nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
        <a th:href="@{/customers}" class="nav-link active"><i class="bi bi-people"></i><span>Customers</span></a>
        <a th:href="@{/bills/new}" class="nav-link"><i class="bi bi-receipt"></i><span>New Bill</span></a>
        <a th:href="@{/bills}" class="nav-link"><i class="bi bi-journal-text"></i><span>All Bills</span></a>
        <a th:href="@{/credit}" class="nav-link"><i class="bi bi-credit-card"></i><span>Credit / Udhari</span></a>
        <a th:href="@{/reports}" class="nav-link"><i class="bi bi-bar-chart"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a th:href="@{/settings}" class="nav-link">
            <i class="bi bi-gear"></i><span>Settings</span>
        </a>
    </div>
</div>

<div class="main-content" id="mainContent">
    <nav class="top-navbar">
        <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <h5 class="mb-0 ms-3" th:text="${isEdit} ? 'Edit Customer' : 'Add New Customer'">Customer</h5>
        <div class="ms-auto">
            <a th:href="@{/customers}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
            <!-- Logout button — add this at the end of ms-auto div -->
            <form th:action="@{/logout}" method="post" class="mb-0 d-inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit"
                        class="btn btn-sm btn-outline-danger"
                        title="Logout">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </nav>

    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="table-card">

                    <!-- Header -->
                    <div class="d-flex align-items-center gap-2 mb-4 pb-3 border-bottom">
                        <div class="stat-icon bg-info bg-opacity-10"
                             style="width:40px;height:40px;font-size:18px">
                            <i class="bi bi-person text-info"></i>
                        </div>
                        <div>
                            <h5 class="mb-0"
                                th:text="${isEdit} ? 'Edit Customer' : 'Add New Customer'">Form</h5>
                            <p class="text-muted small mb-0">Fields marked * are required</p>
                        </div>
                    </div>

                    <form th:action="${isEdit} ? @{/customers/{id}/edit(id=${customer.id})} : @{/customers/new}"
                          th:object="${customer}"
                          method="post">

                        <!-- ADD THIS LINE -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <!-- Personal Details -->
                        <div class="mb-4">
                            <h6 class="fw-bold text-primary mb-3">
                                <i class="bi bi-person-badge me-2"></i>Personal Details
                            </h6>
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        Full Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           th:field="*{name}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="e.g. Ramesh Patil">
                                    <div class="invalid-feedback" th:errors="*{name}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        Mobile Number <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">+91</span>
                                        <input type="tel"
                                               th:field="*{phone}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                               placeholder="9876543210"
                                               maxlength="10">
                                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                                    </div>
                                    <div class="form-text">10-digit Indian mobile number</div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Address</label>
                                    <textarea th:field="*{address}"
                                              class="form-control"
                                              rows="2"
                                              placeholder="Shop/House No., Street, Area, City..."></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           placeholder="optional@email.com">
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Notes</label>
                                    <input type="text"
                                           th:field="*{notes}"
                                           class="form-control"
                                           placeholder="Any notes about this customer">
                                </div>

                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2 pt-3 border-top">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-circle me-2"></i>
                                <span th:text="${isEdit} ? 'Update Customer' : 'Save Customer'">Save</span>
                            </button>
                            <a th:href="@{/customers}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-2"></i>Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });
</script>
</body>
</html>
