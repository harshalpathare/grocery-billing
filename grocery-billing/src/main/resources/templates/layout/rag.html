<div xmlns:th="http://www.thymeleaf.org" th:fragment="ragWidget">
<!-- ✅ COMPLETE RAG AI ASSISTANT WIDGET -->
<!-- Place this just before </body> in every HTML page -->

<!-- Floating Button -->
<button id="ragToggleBtn"
        onclick="toggleRagChat()"
        style="position:fixed;bottom:24px;right:24px;
               width:56px;height:56px;border-radius:50%;
               background:linear-gradient(135deg,#667eea,#764ba2);
               border:none;color:white;font-size:22px;
               box-shadow:0 4px 20px rgba(102,126,234,0.5);
               cursor:pointer;z-index:9999;
               transition:transform 0.2s"
        onmouseover="this.style.transform='scale(1.1)'"
        onmouseout="this.style.transform='scale(1)'">
    🤖
</button>

<!-- Chat Window -->
<div id="ragChatWindow"
     style="display:none;position:fixed;bottom:90px;right:24px;
            width:380px;height:540px;background:white;
            border-radius:16px;
            box-shadow:0 8px 40px rgba(0,0,0,0.15);
            z-index:9998;flex-direction:column;overflow:hidden">

    <!-- ── HEADER ── -->
    <div style="background:linear-gradient(135deg,#667eea,#764ba2);
                padding:16px;color:white;
                display:flex;align-items:center;
                justify-content:space-between">
        <div>
            <div style="font-weight:700;font-size:15px">
                🤖 AI Business Assistant
            </div>
            <div style="font-size:11px;opacity:0.8"
                 id="ragStatusText">
                Ask anything about your shop
            </div>
            <!-- Language indicator -->
            <div id="langIndicator"
                 style="font-size:10px;opacity:0.7;margin-top:2px">
                🌐 English · हिंदी · मराठी
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
            <!-- TTS Toggle -->
            <button onclick="toggleTts()"
                    id="ttsToggleBtn"
                    title="Voice response ON — click to turn off"
                    style="background:rgba(255,255,255,0.2);
                           border:none;color:white;
                           width:28px;height:28px;
                           border-radius:50%;cursor:pointer;
                           font-size:14px">
                🔊
            </button>
            <!-- Close -->
            <button onclick="toggleRagChat()"
                    style="background:rgba(255,255,255,0.2);
                           border:none;color:white;
                           width:28px;height:28px;
                           border-radius:50%;cursor:pointer;
                           font-size:14px">
                ✕
            </button>
        </div>
    </div>

    <!-- ── MESSAGES ── -->
    <div id="ragMessages"
         style="flex:1;overflow-y:auto;padding:16px;
                display:flex;flex-direction:column;gap:12px;
                background:#f8f9fa">

        <!-- Welcome -->
        <div style="background:white;padding:12px;
                    border-radius:4px 12px 12px 12px;
                    box-shadow:0 1px 4px rgba(0,0,0,0.08);
                    font-size:13px;max-width:90%">
            👋 Hello! I'm your AI assistant.
            Type or use <strong>🎤 mic</strong> to speak!
            <div style="margin-top:8px;
                        display:flex;flex-wrap:wrap;gap:4px">
                <button onclick="askQuick(
                            'How were sales today?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    Today sales
                </button>
                <button onclick="askQuick(
                            'What are my top selling products?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    Top products
                </button>
                <button onclick="askQuick(
                            'Which products are low in stock?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    Low stock
                </button>
                <button onclick="askQuick(
                            'Which customers have pending udhari?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    Udhari list
                </button>
                <button onclick="askQuick(
                            'Who are my top customers?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    Top customers
                </button>
                <button onclick="askQuick(
                            'How was business this week?')"
                        style="font-size:11px;padding:3px 8px;
                               border:1px solid #667eea;
                               background:white;color:#667eea;
                               border-radius:12px;cursor:pointer">
                    This week
                </button>
            </div>
        </div>
    </div>

    <!-- ── INPUT AREA ── -->
    <div style="padding:12px;background:white;
                border-top:1px solid #eee">

        <!-- Voice Status Bar -->
        <div id="voiceStatusBar"
             style="display:none;margin-bottom:8px;
                    padding:6px 12px;border-radius:20px;
                    background:linear-gradient(
                        135deg,#ff6b6b,#ee5a24);
                    color:white;font-size:12px;
                    text-align:center">
            🎤 Listening... speak now
        </div>

        <!-- Stop Speaking Button -->
        <div id="stopSpeakingBar"
             style="display:none;margin-bottom:8px">
            <button onclick="stopSpeaking()"
                    style="width:100%;padding:5px;
                           border:none;border-radius:12px;
                           background:linear-gradient(
                               135deg,#ff6b6b,#ee5a24);
                           color:white;font-size:11px;
                           cursor:pointer">
                ⏹ Stop Speaking
            </button>
        </div>

        <!-- Voice not supported -->
        <div id="voiceNotSupported"
             style="display:none;margin-bottom:6px;
                    font-size:11px;color:#dc3545;
                    text-align:center">
            ⚠️ Voice not supported. Use Chrome or Edge.
        </div>

        <!-- Input Row -->
        <div style="display:flex;gap:8px;align-items:center">
            <input type="text"
                   id="ragInput"
                   placeholder="Ask about sales, stock, customers..."
                   style="flex:1;border:1px solid #ddd;
                          border-radius:20px;padding:8px 14px;
                          font-size:13px;outline:none;
                          transition:border-color 0.2s"
                   onfocus="this.style.borderColor='#667eea'"
                   onblur="this.style.borderColor='#ddd'"
                   onkeydown="if(event.key==='Enter')
                               sendRagMessage()">
            <!-- Mic Button -->
            <button onclick="toggleVoiceInput()"
                    id="ragVoiceBtn"
                    title="Click to speak"
                    style="width:36px;height:36px;
                           border-radius:50%;background:white;
                           border:2px solid #667eea;
                           color:#667eea;cursor:pointer;
                           font-size:16px;display:flex;
                           align-items:center;
                           justify-content:center;
                           transition:all 0.2s;flex-shrink:0">
                🎤
            </button>
            <!-- Send Button -->
            <button onclick="sendRagMessage()"
                    id="ragSendBtn"
                    style="width:36px;height:36px;
                           border-radius:50%;
                           background:linear-gradient(
                               135deg,#667eea,#764ba2);
                           border:none;color:white;
                           cursor:pointer;font-size:16px;
                           display:flex;align-items:center;
                           justify-content:center;
                           flex-shrink:0">
                ➤
            </button>
        </div>
    </div>
</div>

<!-- ── STYLES ── -->
<style>
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
    }
    @keyframes voicePulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
        50%       { box-shadow: 0 0 0 8px rgba(255,107,107,0); }
    }
    #voiceStatusBar {
        animation: pulse 1s ease-in-out infinite;
    }
    .voice-active {
        background: linear-gradient(
            135deg,#ff6b6b,#ee5a24) !important;
        border-color: #ff6b6b !important;
        color: white !important;
        animation: voicePulse 1s ease-in-out infinite;
    }
</style>

<!-- ── SCRIPT ── -->
<script>
    let ragOpen          = false;
    let recognition      = null;
    let isListening      = false;
    let ttsEnabled       = true;
    let isSpeaking       = false;
    let currentUtterance = null;

    // ─────────────────────────────────────────────
    // CHAT WINDOW
    // ─────────────────────────────────────────────
    function toggleRagChat() {
        ragOpen = !ragOpen;
        sessionStorage.setItem('ragChatOpen', ragOpen);
        const win = document.getElementById('ragChatWindow');
        win.style.display = ragOpen ? 'flex' : 'none';
        if (ragOpen) {
            document.getElementById('ragInput').focus();
        } else {
            if (isListening) stopVoiceInput();
            stopSpeaking();
        }
    }

    function askQuick(question) {
        document.getElementById('ragInput').value = question;
        sendRagMessage();
    }

    // ─────────────────────────────────────────────
    // SEND MESSAGE
    // ─────────────────────────────────────────────
    function sendRagMessage() {
        const input    = document.getElementById('ragInput');
        const question = input.value.trim();
        if (!question) return;

        appendMessage(question, 'user');
        input.value = '';

        const loadingId = appendMessage('⏳ Thinking...', 'bot', true);

        document.getElementById('ragSendBtn').disabled  = true;
        document.getElementById('ragVoiceBtn').disabled = true;

        const csrfToken = document.querySelector(
            'input[name="_csrf"]')?.value || '';

        fetch('/api/rag/ask', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': csrfToken
            },
            body: JSON.stringify({ question })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById(loadingId)?.remove();
            const answer = data.answer || 'No answer.';
            appendMessage(answer, 'bot');
            speakText(answer); // ✅ Auto speak answer
        })
        .catch(err => {
            document.getElementById(loadingId)?.remove();
            appendMessage('❌ Error: ' + err.message, 'bot');
        })
        .finally(() => {
            document.getElementById('ragSendBtn').disabled  = false;
            document.getElementById('ragVoiceBtn').disabled = false;
        });
    }

    function saveChatHistory() {
        const messages = document.getElementById('ragMessages');
        const clone = messages.cloneNode(true);
        const thinkers = clone.querySelectorAll('.rag-thinking');
        thinkers.forEach(t => t.remove());
        sessionStorage.setItem('ragChatHtml', clone.innerHTML);
    }

    function loadChatHistory() {
        const saved = sessionStorage.getItem('ragChatHtml');
        if (saved) {
            const messages = document.getElementById('ragMessages');
            messages.innerHTML = saved;
            messages.scrollTop = messages.scrollHeight;
        }
        if (sessionStorage.getItem('ragChatOpen') === 'true') {
            ragOpen = true;
            document.getElementById('ragChatWindow').style.display = 'flex';
        }
    }

    document.addEventListener('DOMContentLoaded', loadChatHistory);

    // ─────────────────────────────────────────────
    // APPEND MESSAGE BUBBLE
    // ─────────────────────────────────────────────
    function appendMessage(text, type, isThinking = false) {
        const messages = document.getElementById('ragMessages');
        const id       = 'msg-' + Date.now();
        const isUser   = type === 'user';

        const div = document.createElement('div');
        div.id = id;
        if (isThinking) div.classList.add('rag-thinking');
        div.style.cssText = `
            display:flex;
            justify-content:${isUser ? 'flex-end' : 'flex-start'};
        `;

        const bubble = document.createElement('div');
        bubble.style.cssText = `
            max-width:85%;
            padding:10px 14px;
            border-radius:${isUser
                ? '12px 12px 4px 12px'
                : '4px 12px 12px 12px'};
            font-size:13px;
            line-height:1.6;
            background:${isUser
                ? 'linear-gradient(135deg,#667eea,#764ba2)'
                : 'white'};
            color:${isUser ? 'white' : '#333'};
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
            white-space:pre-wrap;
            word-break:break-word;
        `;
        bubble.textContent = text;
        div.appendChild(bubble);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        if (!isThinking) saveChatHistory();
        return id;
    }

    // ─────────────────────────────────────────────
    // VOICE INPUT (Speech to Text)
    // ─────────────────────────────────────────────
    function toggleVoiceInput() {
        isListening ? stopVoiceInput() : startVoiceInput();
    }

    function startVoiceInput() {
        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('voiceNotSupported')
                .style.display = 'block';
            return;
        }

        recognition              = new SpeechRecognition();
        recognition.lang         = 'en-IN';
        recognition.continuous   = false;
        recognition.interimResults = true;

        recognition.onresult = function(event) {
            let transcript = '';
            for (let i = event.resultIndex;
                     i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            document.getElementById('ragInput').value
                = transcript;
        };

        recognition.onend = function() {
            const val = document.getElementById(
                'ragInput').value.trim();
            stopVoiceInput();
            if (val) setTimeout(() => sendRagMessage(), 300);
        };

        recognition.onerror = function(event) {
            stopVoiceInput();
            if (event.error === 'not-allowed') {
                appendMessage(
                    '🎤 Microphone permission denied. '
                    + 'Please allow microphone access.',
                    'bot');
            } else if (event.error === 'no-speech') {
                appendMessage(
                    '🎤 No speech detected. Try again.',
                    'bot');
            }
        };

        recognition.start();
        isListening = true;

        // Update UI
        const voiceBtn =
            document.getElementById('ragVoiceBtn');
        voiceBtn.classList.add('voice-active');
        voiceBtn.textContent = '⏹';
        voiceBtn.title = 'Click to stop listening';

        document.getElementById('voiceStatusBar')
            .style.display = 'block';
        document.getElementById('ragStatusText')
            .textContent = '🎤 Listening...';
        document.getElementById('ragInput')
            .placeholder = 'Speak now...';
    }

    function stopVoiceInput() {
        if (recognition) { recognition.stop(); recognition = null; }
        isListening = false;

        const voiceBtn = document.getElementById('ragVoiceBtn');
        voiceBtn.classList.remove('voice-active');
        voiceBtn.textContent = '🎤';
        voiceBtn.title = 'Click to speak';

        document.getElementById('voiceStatusBar')
            .style.display = 'none';
        document.getElementById('ragStatusText')
            .textContent = 'Ask anything about your shop';
        document.getElementById('ragInput')
            .placeholder = 'Ask about sales, stock, customers...';
    }

    // ─────────────────────────────────────────────
    // TEXT TO SPEECH (AI Answer Read Aloud)
    // ─────────────────────────────────────────────
    function toggleTts() {
        ttsEnabled = !ttsEnabled;
        const btn = document.getElementById('ttsToggleBtn');
        if (ttsEnabled) {
            btn.textContent      = '🔊';
            btn.title            = 'Voice response ON';
            btn.style.background = 'rgba(255,255,255,0.2)';
            appendMessage('🔊 Voice response turned ON', 'bot');
        } else {
            btn.textContent      = '🔇';
            btn.title            = 'Voice response OFF';
            btn.style.background = 'rgba(255,0,0,0.3)';
            stopSpeaking();
            appendMessage('🔇 Voice response turned OFF', 'bot');
        }
    }

    function speakText(text) {
        if (!ttsEnabled) return;
        if (!window.speechSynthesis) return;

        stopSpeaking();

        // Clean text
        const cleanText = text
            .replace(/[🤖👋📦⚠️🎯👤💡📊✅❌⏳🔊🔇🎤⏹🏆⭐]/gu, '')
            .replace(/\*\*/g, '')
            .replace(/\*/g,   '')
            .replace(/#{1,6}/g, '')
            .replace(/\n+/g,  '. ')
            .trim();

        if (!cleanText) return;

        currentUtterance =
            new SpeechSynthesisUtterance(cleanText);
        currentUtterance.lang   = 'en-IN';
        currentUtterance.rate   = 0.95;
        currentUtterance.pitch  = 1.0;
        currentUtterance.volume = 1.0;

        // Pick best available voice
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v =>
            v.lang === 'en-IN' ||
            v.lang === 'en-GB' ||
            v.name.includes('Google') ||
            v.name.includes('Microsoft')
        );
        if (preferred) currentUtterance.voice = preferred;

        currentUtterance.onstart = () => {
            isSpeaking = true;
            document.getElementById('ragStatusText')
                .textContent = '🔊 Speaking...';
            document.getElementById('stopSpeakingBar')
                .style.display = 'block';
        };

        currentUtterance.onend = () => {
            isSpeaking = false;
            document.getElementById('ragStatusText')
                .textContent = 'Ask anything about your shop';
            document.getElementById('stopSpeakingBar')
                .style.display = 'none';
        };

        currentUtterance.onerror = () => {
            isSpeaking = false;
            document.getElementById('stopSpeakingBar')
                .style.display = 'none';
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    function stopSpeaking() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        isSpeaking = false;
        document.getElementById('stopSpeakingBar')
            .style.display = 'none';
        document.getElementById('ragStatusText')
            .textContent = 'Ask anything about your shop';
    }

    // Load voices async (Chrome requirement)
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    }
    // ── Language detection & indicator ───────────
function detectLang(text) {
    const devanagari = /[\u0900-\u097F]/;
    if (!devanagari.test(text)) return 'en';
    // Marathi indicators
    if (/आहे|काय|किती|कसे/.test(text)) return 'mr';
    return 'hi';
}

// Update language indicator when typing
document.getElementById('ragInput')
    .addEventListener('input', function() {
        const lang = detectLang(this.value);
        const indicator =
            document.getElementById('langIndicator');
        if (indicator) {
            indicator.textContent =
                lang === 'hi' ? '🇮🇳 हिंदी' :
                lang === 'mr' ? '🟠 मराठी' :
                '🌐 English';
        }
        // Set voice recognition language
        if (recognition) {
            recognition.lang =
                lang === 'hi' ? 'hi-IN' :
                lang === 'mr' ? 'mr-IN' : 'en-IN';
        }
    });
</script>



</div>
