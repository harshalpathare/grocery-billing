<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management | Grocery Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span>Grocery Bill</span></div>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a th:href="@{/products}" class="nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
        <a th:href="@{/suppliers}" class="nav-link"><i class="bi bi-truck"></i><span>Suppliers</span></a>
        <a th:href="@{/purchases}" class="nav-link"><i class="bi bi-cart-check"></i><span>Purchases</span></a>
        <a th:href="@{/customers}" class="nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
        <a th:href="@{/bills/new}" class="nav-link"><i class="bi bi-receipt"></i><span>New Bill</span></a>
        <a th:href="@{/bills}" class="nav-link"><i class="bi bi-journal-text"></i><span>All Bills</span></a>
        <a th:href="@{/credit}" class="nav-link"><i class="bi bi-credit-card"></i><span>Credit / Udhari</span></a>
        <a th:href="@{/reports}" class="nav-link"><i class="bi bi-bar-chart"></i><span>Reports</span></a>
        <a th:href="@{/activity}" class="nav-link" th:classappend="${activePage == 'activity'} ? 'active' : ''"><i class="bi bi-clock-history"></i><span>Activity Log</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a th:href="@{/settings}" class="nav-link" th:classappend="${activePage == 'settings'} ? 'active' : ''"><i class="bi bi-gear"></i><span>Settings</span></a>
    </div>
</div>

<div class="main-content" id="mainContent">
    <nav class="top-navbar">
        <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <h5 class="mb-0 ms-3"><i class="bi bi-people"></i> User Management</h5>
    </nav>

    <div class="page-content">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="table-card mb-4">
                    <h6 class="fw-bold mb-3">Add / Update User</h6>
                    <form th:action="@{/settings/users}" method="post" th:object="${userForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="admin" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Leave blank to keep existing password" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select th:field="*{role}" class="form-select">
                                <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                                <option value="ROLE_USER">ROLE_USER</option>
                            </select>
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input type="checkbox" th:field="*{enabled}" class="form-check-input" />
                            <label class="form-check-label">Enabled</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Save User</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="table-card mb-4">
                    <h6 class="fw-bold mb-3">Users</h6>
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Role</th>
                            <th>Enabled</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.role}"></td>
                            <td><span th:text="${u.enabled} ? 'Yes' : 'No'"></span></td>
                            <td>
                                <form th:action="@{/settings/users/{id}/delete(id=${u.id})}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete user?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
